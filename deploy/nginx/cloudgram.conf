server {
    server_name cloudgram.datvan.com;

    root /var/www/cloudgram;
    index index.html;

    # CloudGram giữ trạng thái trong URL (/folder/<id>) nhưng không có file nào
    # tương ứng trên đĩa, nên đường dẫn không khớp file phải rơi về app shell và
    # để router phía trình duyệt tự xử lý.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tên file asset có hash theo nội dung, đổi mỗi lần build, nên cache được
    # lâu. =404 ở đây là cố ý: asset thiếu phải báo thiếu, không được rơi về
    # index.html rồi trả HTML với mã 200.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cloudgram.datvan.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cloudgram.datvan.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = cloudgram.datvan.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name cloudgram.datvan.com;
    return 404; # managed by Certbot


}