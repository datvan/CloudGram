server {
    server_name cloudgram.datvan.com;

    root /var/www/cloudgram;
    index index.html;

    # Header bảo mật cho mọi phản hồi. "always" để cả trang lỗi cũng có.
    #
    # CSP: GramJS nói MTProto qua WebSocket tới wss://<dc>.web.telegram.org,
    # nên connect-src phải mở cho *.web.telegram.org. Nhập từ Dropbox tải ZIP
    # thẳng từ *.dl.dropboxusercontent.com nên cũng phải có ở đó. Ảnh, video, PDF xem
    # trước đều là blob: tạo trong trình duyệt. MUI (emotion) chèn thẻ <style>
    # lúc chạy nên style-src cần 'unsafe-inline'; script thì không.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; frame-src blob:; font-src 'self' data:; connect-src 'self' wss://*.web.telegram.org https://*.web.telegram.org https://dl.dropboxusercontent.com https://*.dl.dropboxusercontent.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Dịch vụ tài khoản (server/ trong repo), chỉ nghe trên loopback.
    # Không có try_files ở đây: một /api/... sai phải nhận 404 JSON từ chính
    # dịch vụ, không được rơi về index.html.
    location /api/ {
        proxy_pass http://127.0.0.1:4322;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # dịch vụ đọc IP thật từ CF-Connecting-IP để giới hạn đăng nhập sai;
        # ufw chỉ cho Cloudflare vào nên header này đáng tin
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        # cây file mã hoá có thể tới 25 MB
        client_max_body_size 30m;
        proxy_read_timeout 30s;
    }

    # CloudGram giữ trạng thái trong URL (/folder/<id>, /setup#...) nhưng
    # không có file nào tương ứng trên đĩa, nên đường dẫn không khớp file phải
    # rơi về app shell và để router phía trình duyệt tự xử lý.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html trỏ tới asset theo hash của bản build hiện tại; cache nó
        # thì sau mỗi lần deploy trình duyệt cũ sẽ đi tìm asset đã bị xoá.
        # Có add_header trong location thì nginx bỏ toàn bộ add_header của
        # server, nên các header bảo mật phải lặp lại nguyên văn bên dưới.
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; frame-src blob:; font-src 'self' data:; connect-src 'self' wss://*.web.telegram.org https://*.web.telegram.org https://dl.dropboxusercontent.com https://*.dl.dropboxusercontent.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Tên file asset có hash theo nội dung, đổi mỗi lần build, nên cache được
    # lâu. =404 ở đây là cố ý: asset thiếu phải báo thiếu, không được rơi về
    # index.html rồi trả HTML với mã 200.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cloudgram.datvan.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cloudgram.datvan.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = cloudgram.datvan.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name cloudgram.datvan.com;
    return 404; # managed by Certbot


}
