# Tải đoạn video lên thẳng VPS, không qua Cloudflare.
#
# Lý do: với một số mạng, chặng Cloudflare -> VPS nhận dữ liệu rất chậm (đo
# được khoảng 3-11 KB/s cho 2 MiB), trong khi tải thẳng tới VPS nhanh. Chỉ
# MỘT đường được mở ở cổng này: PUT một đoạn video của một phiên đang phát
# (server/play.js). Mọi thứ khác ở cổng này trả 404, và các site khác trên VPS
# không nghe ở cổng này, nên ufw chỉ cần mở thêm đúng cổng 8444.
#
# Không có cookie ở đây (khác origin): phiên được xác thực bằng khoá riêng
# trong header X-Play-Key, do server cấp lúc mở phiên.
#
# Cài bằng deploy/vps-direct-upload.sh (cần bản ghi DNS "up" chỉ tới VPS, chế
# độ DNS only, mây xám). Cổng 80 chỉ dùng cho certbot xin và gia hạn chứng chỉ.

limit_req_zone $binary_remote_addr zone=cg_upload:1m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name up.datvan.com;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 404;
    }
}

server {
    listen 8444 ssl default_server;
    listen [::]:8444 ssl default_server;
    server_name up.datvan.com;

    ssl_certificate /etc/letsencrypt/live/up.datvan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/up.datvan.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # một đoạn là 2 MiB
    client_max_body_size 3m;
    client_body_timeout 120s;

    location ~ "^/api/play/[A-Za-z0-9_-]{22}/chunks/[0-9]+$" {
        # trình duyệt hỏi trước (khác origin, có header riêng)
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://cloudgram.datvan.com" always;
            add_header Access-Control-Allow-Methods "PUT, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, X-Play-Key" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }
        # not limit_except: it makes a nested location, so the OPTIONS rule
        # above would never run (answered 403 instead of 204)
        if ($request_method != PUT) {
            return 405;
        }
        limit_req zone=cg_upload burst=40 nodelay;

        add_header Access-Control-Allow-Origin "https://cloudgram.datvan.com" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;

        proxy_pass http://127.0.0.1:4322;
        proxy_http_version 1.1;
        proxy_set_header Host cloudgram.datvan.com;
        # dịch vụ lấy IP khách từ header này; ghi đè, không chuyển tiếp của khách
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
